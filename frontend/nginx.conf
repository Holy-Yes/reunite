# Mirrors the Vite dev proxy (vite.config.ts): the frontend stays same-origin with the API in
# production, so no VITE_API_URL / CORS config is needed on the frontend side.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
